<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login</title><link rel="stylesheet" th:href="@{/styles.css}"></head>
<body><div th:replace="~{fragments :: header}"></div><main>
<h1>Login</h1><p class="error" th:if="${error}" th:text="${error}"></p>
<form class="form" th:action="@{/login}" method="post">
<label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" required></label>
<button type="submit">Login</button></form>
</main><div th:replace="~{fragments :: footer}"></div></body></html>
