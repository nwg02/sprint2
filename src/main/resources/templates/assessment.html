<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Insurance Assessment</title><link rel="stylesheet" th:href="@{/styles.css}"></head>
<body><div th:replace="~{fragments :: header}"></div><main>
<h1>Insurance Assessment</h1><p>Enter your details to save an assessment and view sample plan recommendations.</p>
<p class="error" th:if="${error}" th:text="${error}"></p>
<p th:if="${saved}">Your assessment was saved.</p>
<form class="form" th:action="@{/assessment}" method="post">
<label>Age<input type="number" name="age" min="18" max="110" required></label>
<label>Coverage type<select name="coverageType" required><option value="individual">Individual</option><option value="family">Family</option></select></label>
<label>Monthly budget ($)<input type="number" name="monthlyBudget" min="1" step="0.01" required></label>
<label>Household size<input type="number" name="householdSize" min="1" max="20" required></label>
<button type="submit">Submit assessment</button></form>
<section th:if="${plans != null}"><h2>Suggested plans</h2><article class="plan" th:each="p : ${plans}">
<h3 th:text="${p.plan_name}"></h3><p th:text="${p.description}"></p>
<p>Monthly premium: $<span th:text="${p.monthly_premium}"></span></p><p>Deductible: $<span th:text="${p.deductible}"></span></p>
</article></section>
</main><div th:replace="~{fragments :: footer}"></div></body></html>
