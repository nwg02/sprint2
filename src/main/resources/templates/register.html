<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register</title><link rel="stylesheet" th:href="@{/styles.css}"></head>
<body><div th:replace="~{fragments :: header}"></div><main>
<h1>Create an account</h1><p class="error" th:if="${error}" th:text="${error}"></p>
<form class="form" th:action="@{/register}" method="post">
<label>First name<input name="firstName" required maxlength="80"></label>
<label>Last name<input name="lastName" required maxlength="80"></label>
<label>Email<input type="email" name="email" required maxlength="160"></label>
<label>Password (at least 8 characters)<input type="password" name="password" required minlength="8"></label>
<button type="submit">Register</button></form>
</main><div th:replace="~{fragments :: footer}"></div></body></html>
